{% extends 'base.html' %}

{% block title %}My Profile - Fashion Store{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row">
        <div class="col-md-8">
            <div class="card shadow mb-4">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0"><i class="fas fa-user-circle"></i> Profile Information</h5>
                </div>
                <div class="card-body">
                    <form id="profileForm">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="username" class="form-label">Username</label>
                                <input type="text" class="form-control" id="username" value="{{ user.username }}" disabled>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="email" class="form-label">Email Address</label>
                                <input type="email" class="form-control" id="email" name="email" value="{{ user.email }}" required>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="phone" class="form-label">Phone Number</label>
                                <input type="tel" class="form-control" id="phone" name="phone" value="{{ user.phone or '' }}" placeholder="+1 (555) 000-0000">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="createdAt" class="form-label">Member Since</label>
                                <input type="text" class="form-control" value="{{ user.created_at.strftime('%B %d, %Y') if user.created_at else 'N/A' }}" disabled>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="address" class="form-label">Address</label>
                            <textarea class="form-control" id="address" name="address" rows="3" placeholder="Enter your address">{{ user.address or '' }}</textarea>
                        </div>
                        
                        <button type="button" class="btn btn-primary" id="updateBtn">
                            <i class="fas fa-save"></i> Save Changes
                        </button>
                    </form>
                </div>
            </div>
            
            <div class="card shadow">
                <div class="card-header bg-danger text-white">
                    <h5 class="mb-0"><i class="fas fa-lock"></i> Account Security</h5>
                </div>
                <div class="card-body">
                    <p class="text-muted">To change your password, please use the form below:</p>
                    <form id="passwordForm">
                        <div class="mb-3">
                            <label for="currentPassword" class="form-label">Current Password</label>
                            <input type="password" class="form-control" id="currentPassword" name="currentPassword" required>
                        </div>
                        <div class="mb-3">
                            <label for="newPassword" class="form-label">New Password</label>
                            <input type="password" class="form-control" id="newPassword" name="newPassword" required minlength="6">
                        </div>
                        <div class="mb-3">
                            <label for="confirmNewPassword" class="form-label">Confirm New Password</label>
                            <input type="password" class="form-control" id="confirmNewPassword" name="confirmNewPassword" required minlength="6">
                        </div>
                        <button type="submit" class="btn btn-danger" id="changePasswordBtn">
                            <i class="fas fa-key"></i> Change Password
                        </button>
                    </form>
                </div>
            </div>
        </div>
        
        <div class="col-md-4">
            <div class="card shadow">
                <div class="card-body text-center">
                    <div class="mb-3">
                        <i class="fas fa-user-circle fa-5x text-primary"></i>
                    </div>
                    <h5>{{ user.username }}</h5>
                    <p class="text-muted mb-3">{{ user.email }}</p>
                    <a href="{{ url_for('orders') }}" class="btn btn-info w-100 mb-2">
                        <i class="fas fa-history"></i> My Orders
                    </a>
                    <a href="{{ url_for('logout') }}" class="btn btn-outline-danger w-100">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('updateBtn').addEventListener('click', function() {
    const formData = new FormData(document.getElementById('profileForm'));
    fetch('/update-profile', {
        method: 'POST',
        body: formData
    }).then(r => r.json()).then(d => {
        alert(d.msg);
        if (d.success) location.reload();
    });
});

document.getElementById('passwordForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const newPassword = document.getElementById('newPassword').value;
    const confirmNewPassword = document.getElementById('confirmNewPassword').value;
    
    if (newPassword !== confirmNewPassword) {
        alert('Passwords do not match!');
        return;
    }
    
    alert('Password change feature coming soon!');
});
</script>
{% endblock %}
